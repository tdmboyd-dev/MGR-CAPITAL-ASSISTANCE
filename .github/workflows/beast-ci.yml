name: BEAST CI

on:
  push:
    branches:
      - beast/**
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mgr
          POSTGRES_PASSWORD: mgr_ci_password
          POSTGRES_DB: mgr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mgr -d mgr_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mgr:mgr_ci_password@localhost:5432/mgr_ci
      JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production-0123456789
      CORS_ORIGINS: http://localhost:3011
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma db push --skip-generate
      - run: npm run build
      - run: npm test -- --runInBand

  frontend:
    name: Next frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  legacy-app:
    name: Legacy Vite app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
